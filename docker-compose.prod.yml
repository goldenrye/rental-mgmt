# Production overrides for an HTTPS deployment with Let's Encrypt certificates.
# Set DOMAIN in .env, then run:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# or set COMPOSE_FILE=docker-compose.yml:docker-compose.prod.yml in .env to make it the default.

x-letsencrypt-volume: &letsencrypt-volume
  # live/*.pem are symlinks into archive/, so mount the whole tree
  /etc/letsencrypt:/etc/letsencrypt:ro

services:
  frontend:
    build:
      args:
        # nginx proxies /api to the api service, so the HTTPS page never calls plain HTTP
        VITE_API_BASE_URL: /api
    # Only HTTPS is published; host port 80 stays free for certbot's standalone renewal
    ports: !override
      - "443:443"
    volumes:
      - *letsencrypt-volume
    environment:
      NGINX_SSL_CERTFILE: /etc/letsencrypt/live/${DOMAIN:?set DOMAIN in .env}/fullchain.pem
      NGINX_SSL_KEYFILE: /etc/letsencrypt/live/${DOMAIN:?set DOMAIN in .env}/privkey.pem

  api:
    # Reached only through nginx at https://${DOMAIN}/api
    ports: !reset []
    environment:
      CORS_ORIGINS: https://${DOMAIN:?set DOMAIN in .env}

  mcp:
    volumes:
      - *letsencrypt-volume
    environment:
      RENTAL_MGMT_MCP_SSL_CERTFILE: /etc/letsencrypt/live/${DOMAIN:?set DOMAIN in .env}/fullchain.pem
      RENTAL_MGMT_MCP_SSL_KEYFILE: /etc/letsencrypt/live/${DOMAIN:?set DOMAIN in .env}/privkey.pem
      RENTAL_MGMT_MCP_PUBLIC_BASE_URL: https://${DOMAIN:?set DOMAIN in .env}:8001
      # Token requests go over HTTPS through the nginx /api proxy
      RENTAL_MGMT_MCP_AUTH_SERVER_URL: https://${DOMAIN:?set DOMAIN in .env}/api

  db:
    # Postgres is reachable only from the other containers
    ports: !reset []
