# Production overrides for an HTTPS deployment with Let's Encrypt certificates.
# Set DOMAIN in .env, then run:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# or set COMPOSE_FILE=docker-compose.yml:docker-compose.prod.yml in .env to make it the default.

x-letsencrypt-volume: &letsencrypt-volume
  # live/*.pem are symlinks into archive/, so mount the whole tree
  /etc/letsencrypt:/etc/letsencrypt:ro

services:
  frontend:
    build:
      args:
        # nginx proxies /api to the api service, so the HTTPS page never calls plain HTTP
        VITE_API_BASE_URL: /api
    # Port 80 redirects to HTTPS and serves Let's Encrypt webroot challenges
    ports: !override
      - "80:80"
      - "443:443"
    volumes:
      - *letsencrypt-volume
      - /var/www/certbot:/var/www/certbot:ro
    environment:
      NGINX_SSL_CERTFILE: /etc/letsencrypt/live/${DOMAIN:?set DOMAIN in .env}/fullchain.pem
      NGINX_SSL_KEYFILE: /etc/letsencrypt/live/${DOMAIN:?set DOMAIN in .env}/privkey.pem

  api:
    # Reached only through nginx at https://${DOMAIN}/api
    ports: !reset []
    environment:
      CORS_ORIGINS: https://${DOMAIN:?set DOMAIN in .env}
      # Unpublished, so only nginx can set X-Real-IP; login lockout is keyed by it
      TRUST_PROXY_HEADERS: "true"

  mcp:
    # Reached only through nginx at https://${DOMAIN}/mcp, which terminates TLS and rate-limits
    ports: !reset []
    environment:
      RENTAL_MGMT_MCP_PUBLIC_BASE_URL: https://${DOMAIN:?set DOMAIN in .env}
      # Token requests go over HTTPS through the nginx /api proxy
      RENTAL_MGMT_MCP_AUTH_SERVER_URL: https://${DOMAIN:?set DOMAIN in .env}/api

  db:
    # Postgres is reachable only from the other containers
    ports: !reset []

  backup:
    image: postgres:16-alpine
    entrypoint: ["/bin/sh", "/usr/local/bin/backup_db.sh"]
    environment:
      PGHOST: db
      PGUSER: rental
      PGPASSWORD: rental
      PGDATABASE: rental_mgmt
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      # Off-instance copy; local dumps alone do not survive losing the EC2 instance or its volume
      BACKUP_S3_URI: ${BACKUP_S3_URI:-}
    volumes:
      - ./scripts/backup_db.sh:/usr/local/bin/backup_db.sh:ro
      - ${BACKUP_DIR:-./backups}:/backups
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
