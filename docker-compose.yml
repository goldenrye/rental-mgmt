services:
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - api

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://rental:rental@db:5432/rental_mgmt
      JWT_SECRET_KEY: replace-this-with-a-long-random-secret
    depends_on:
      - db

  mcp:
    build: .
    command: ["python", "-m", "app.mcp_server"]
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql+psycopg://rental:rental@db:5432/rental_mgmt
      JWT_SECRET_KEY: replace-this-with-a-long-random-secret
      RENTAL_MGMT_MCP_TRANSPORT: streamable-http
      RENTAL_MGMT_MCP_HOST: 0.0.0.0
      RENTAL_MGMT_MCP_PORT: 8001
      RENTAL_MGMT_MCP_AUTH_ENABLED: "true"
      RENTAL_MGMT_MCP_AUTH_SERVER_URL: http://localhost:8000
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rental_mgmt
      POSTGRES_USER: rental
      POSTGRES_PASSWORD: rental
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
